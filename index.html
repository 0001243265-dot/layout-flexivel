<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riot Games - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

 
        <section class="login">

            <img src="imagem/riot-logo.png" width="80" alt="logo" class="riot-logo">

       

            <form>

                <div class="input-box">
                    <input type="text" placeholder="USERNAME">
                    <span>♙</span>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="PASSWORD">
                    <span>◉</span>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>
                <div>
    <button class="btn-login" type="submit">
                    SIGN IN
                </button>
                  </div>
            </form>

            <p class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </p>

            <div class="divider">
                <span>Or Sign In With</span>
            </div>

            <div class="social-login">
                <button class="google"><img src="imagem/vecteezy_google-search-logo-icon_72677661.png" width="20" alt=""></button>
                <button class="xbox"><img src="imagem/vecteezy_xbox-logo-png-xbox-icon-transparent-png_20975583.png" width="40" alt=""></button>
            </div>

        </section>
        

    </main>

</body>
</html>
